# MintKit build configuration
REPO_ROOT="${REPO_ROOT:-$(cd "$(dirname "${BASH_SOURCE[0]}")/../.." && pwd)}"
MINTKIT_VERSION="1.3.1"
TARGET_ARCH="arm64"
TARGET_BOARD="pizero2w"
KERNEL_BRANCH="rpi-6.1.y"

# Output
DIST_DIR="$REPO_ROOT/dist"
ROOTFS_DIR="$REPO_ROOT/rootfs"
IMG_NAME="mintkit-pizero2w-v${MINTKIT_VERSION}.img"
IMG_SIZE_MB=1800       # unused by build-image.sh; kept equal to IMAGE_SIZE_MB

# Pi Zero 2 W specifics
BOARD_DTB="bcm2710-rpi-zero-2-w.dtb"
BOARD_DTB_OVERLAY=""
GPU_MEM=128            # must match config.txt; 128 is what the shipped card uses
RPI_FIRMWARE_TAG="stable"

# Launcher
LAUNCHER_USER="mintkit"
LAUNCHER_HOME="/home/mintkit"
LAUNCHER_SERVICE="mintkit.service"

# Image assembly
# WARNING: build-image.sh reads IMAGE_SIZE_MB and nothing else. Its parted
# offsets are hardcoded to "1MiB 65MiB" fat32 + "65MiB 100%" ext4, so the two
# size vars below are documentation only and are NOT honored. The real boot
# partition is 64 MiB. Change build-image.sh if you need different offsets.
IMAGE_SIZE_MB=1800      # total image size (~1.8 GB fits a 2 GB card). USED.
BOOT_SIZE_MB=64         # FAT32 boot partition. Informational, see warning.
ROOT_SIZE_MB=1736       # ext4 root, remainder. Informational, see warning.
